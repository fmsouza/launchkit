name: Canary Release

# Canary is a NIGHTLY channel: one build per night covering everything merged
# since the previous canary — never one build per merge. `ci.yml` still runs the
# full verify gate on every push to main and every PR, so main stays verified
# per-merge; only the five-platform build + publish is nightly.
on:
  schedule:
    # 03:17 UTC. GitHub cron is UTC-only (no DST shift) and scheduled runs fire
    # on the DEFAULT BRANCH only — i.e. main, the same source the old
    # `push: branches: [main]` trigger used, so `github.sha` is still main's tip.
    # The `:17` is deliberate: the scheduler is congested at :00 and delays runs
    # queued there.
    # NOTE: GitHub disables scheduled workflows in a repository with no activity
    # for 60 days. Any push re-enables them.
    - cron: "17 3 * * *"
  # Manual "Run workflow" (Actions tab, or `gh workflow run canary.yml`) for an
  # on-demand canary. A manual run ALWAYS builds — it bypasses the
  # no-new-commits guard in the `version` job.
  workflow_dispatch:

concurrency:
  group: canary-release
  # Queue, never cancel. Under the per-merge trigger a newer commit legitimately
  # superseded an in-flight run. Now the realistic collision is a manual dispatch
  # landing on a running nightly, and killing that between `gh release create`
  # (tag + release page already published) and the update-feed upload would leave
  # a half-published canary behind.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Runs FIRST and is read-only (it only lists releases), so an idle night is
  # decided before a single runner-minute is spent on the gate or the build
  # matrices.
  version:
    name: Determine canary version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      should-build: ${{ steps.version.outputs.should-build }}
      canary-build: ${{ steps.version.outputs.canary-build }}
      canary-tag: ${{ steps.version.outputs.tag }}
      start-tag: ${{ steps.version.outputs.start-tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Compute canary build number
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          VERSION=$(jq -r .version package.json)
          LATEST=$(gh release list --limit 200 --json tagName --jq \
            "[.[] | select(.tagName | startswith(\"v${VERSION}-canary.\")) | .tagName | ltrimstr(\"v${VERSION}-canary.\") | tonumber] | max // 0")
          NEXT=$((LATEST + 1))
          echo "canary-build=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-canary.${NEXT}" >> "$GITHUB_OUTPUT"

          # Changelog lower boundary (--notes-start-tag), same channel:
          #   1. previous canary of THIS base version (v${VERSION}-canary.${LATEST}), else
          #   2. most recent canary tag overall (any base version, semver-ordered), else
          #   3. empty -> downstream omits the flag and GitHub auto-picks.
          # The select() filters to CANARY tags only before `sort -V`: never mix channels
          # here. `sort -V` orders a stable tag BELOW its own prerelease (opposite of
          # semver), which is harmless only because we sort one channel at a time.
          # No `set -o pipefail` (GHA runs `bash -e`): when no canary exists the jq stream
          # is empty, `tail -n1` is the pipeline tail and exits 0, so START_TAG is "" and
          # the step does not abort. Keep `tail`/`head` last if you ever refactor this pipe.
          if [ "${LATEST}" -ge 1 ]; then
            START_TAG="v${VERSION}-canary.${LATEST}"
          else
            START_TAG=$(gh release list --limit 200 --json tagName --jq \
              '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+-canary\\.[0-9]+$"))] | .[]' \
              | sort -V | tail -n1)
          fi
          echo "start-tag=${START_TAG}" >> "$GITHUB_OUTPUT"

          # Nightly guard — the previous canary (START_TAG) doubles as the "last
          # built commit" marker, so no extra release lookup is needed. Skip only
          # when that tag points at the exact commit this run would rebuild.
          # `gh release create` writes LIGHTWEIGHT tags, so `.object.sha` IS the
          # commit sha; were a tag ever annotated it would be the tag object
          # instead and the comparison would report "changed" — erring toward
          # building, never toward silently skipping. Same on API failure
          # (PREV_SHA empty). Resolving via the API keeps the default shallow
          # checkout (no fetch-depth: 0).
          SHOULD_BUILD=true
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — building regardless of new commits."
          elif [ -n "${START_TAG}" ]; then
            PREV_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${START_TAG}" --jq '.object.sha' || echo "")
            echo "Previous canary ${START_TAG} -> ${PREV_SHA:-<unresolved>}; HEAD -> ${GITHUB_SHA}"
            if [ "${PREV_SHA}" = "${GITHUB_SHA}" ]; then
              SHOULD_BUILD=false
            fi
          fi
          echo "should-build=${SHOULD_BUILD}" >> "$GITHUB_OUTPUT"
          if [ "${SHOULD_BUILD}" = "false" ]; then
            {
              echo "### Canary skipped"
              echo
              echo "No commits on \`main\` since \`${START_TAG}\` (\`${GITHUB_SHA}\`) — nothing to build."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  gate:
    name: Quality Gate
    needs: version
    # An idle night stops here. GitHub skips the dependents of a skipped job, so
    # build-cli, build-desktop and release fall away with the gate — a night with
    # no new commits costs one short `version` job and nothing else.
    if: needs.version.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - run: bun audit

  build-cli:
    name: Build CLI (${{ matrix.name }})
    needs: [gate, version]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            asset: spectrum-darwin-arm64
            archive: tar.gz
          - name: macOS x64
            os: macos-15-intel
            asset: spectrum-darwin-x64
            archive: tar.gz
          - name: Linux x64
            os: ubuntu-latest
            asset: spectrum-linux-x64
            archive: tar.gz
          - name: Linux arm64
            os: ubuntu-24.04-arm
            asset: spectrum-linux-arm64
            archive: tar.gz
          - name: Windows x64
            os: windows-latest
            asset: spectrum-windows-x64
            archive: zip
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      - name: Compile CLI binary
        run: bun run --filter spectrum-cli compile

      - name: CLI smoke
        # Drives the canonical, cross-platform smoke script (apps/cli/scripts/smoke.ts)
        # that `bun run smoke` uses locally — so CI and local can never drift apart. The
        # script asserts the binary exists, then runs `list harnesses` (non-empty stdout
        # from the built-in registry) and `list providers` (exit 0; may be empty on a
        # fresh config). It picks the .exe suffix on win32 itself. Exits non-zero on any
        # failure, which is the gate CI wants.
        shell: bash
        run: bun run --filter spectrum-cli smoke

      - name: Stage CLI archive (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage-cli
          cp apps/cli/dist/spectrum-cli "stage-cli/${{ matrix.asset }}-cli"
          tar czf "stage-cli/${{ matrix.asset }}-cli.tar.gz" -C stage-cli "${{ matrix.asset }}-cli"
          rm -f "stage-cli/${{ matrix.asset }}-cli"

      - name: Stage CLI archive (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage-cli | Out-Null
          $cliExe = "apps/cli/dist/spectrum-cli.exe"
          if (-not (Test-Path $cliExe)) {
            # Some Windows builds may emit the binary without the .exe suffix — copy and rename.
            Copy-Item "apps/cli/dist/spectrum-cli" "stage-cli/${{ matrix.asset }}-cli.exe"
          } else {
            Copy-Item $cliExe "stage-cli/${{ matrix.asset }}-cli.exe"
          }
          Compress-Archive "stage-cli/${{ matrix.asset }}-cli.exe" "stage-cli/${{ matrix.asset }}-cli.zip"
          Remove-Item "stage-cli/${{ matrix.asset }}-cli.exe"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}-cli
          path: stage-cli/*
          if-no-files-found: error

  build-desktop:
    name: Build Desktop (${{ matrix.name }})
    needs: [gate, version]
    runs-on: ${{ matrix.os }}
    # See release.yml: without this cap a wedged smoke stalls the leg for GitHub's 6h default.
    timeout-minutes: 30
    # Signing secrets live in the "Production" GitHub Environment (scoped to main + v* tags).
    # A job can only read environment secrets if it declares the environment. Canary builds
    # run on main, which the environment's deployment rules allow.
    environment: Production
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            asset: spectrum-darwin-arm64
            archive: tar.gz
            app: true
          - name: macOS x64
            # macos-13 (Intel) was retired by GitHub on 2025-12-04; macos-15-intel
            # is the replacement x86_64 label (Intel support ends Fall 2027).
            os: macos-15-intel
            asset: spectrum-darwin-x64
            archive: tar.gz
            app: true
          - name: Linux x64
            os: ubuntu-latest
            asset: spectrum-linux-x64
            archive: tar.gz
            app: true
          - name: Linux arm64
            os: ubuntu-24.04-arm
            asset: spectrum-linux-arm64
            archive: tar.gz
            app: true
          - name: Windows x64
            os: windows-latest
            asset: spectrum-windows-x64
            archive: zip
            app: true
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      - name: Set up macOS signing
        if: matrix.app && runner.os == 'macOS'
        shell: bash
        # Reads the signing material straight from GitHub Secrets (a composite action
        # cannot access the `secrets` context, so this lives inline in the workflow).
        # Imports the Developer ID cert into a temp keychain and exports the env vars
        # Electrobun reads at sign/notarize time. The keychain is torn down by the
        # "Clean up signing keychain" step (if: always()).
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          # Preflight — every signing secret must be present (channel builds must be signed).
          missing=()
          [ -n "${CERT_P12_BASE64:-}" ]   || missing+=(MACOS_CERTIFICATE_P12_BASE64)
          [ -n "${CERT_PASSWORD:-}" ]     || missing+=(MACOS_CERTIFICATE_PASSWORD)
          [ -n "${SIGN_IDENTITY:-}" ]     || missing+=(MACOS_SIGN_IDENTITY)
          [ -n "${KEYCHAIN_PASSWORD:-}" ] || missing+=(MACOS_KEYCHAIN_PASSWORD)
          [ -n "${API_KEY_P8_BASE64:-}" ] || missing+=(APPLE_API_KEY_P8_BASE64)
          [ -n "${API_KEY_ID:-}" ]        || missing+=(APPLE_API_KEY_ID)
          [ -n "${API_ISSUER_ID:-}" ]     || missing+=(APPLE_API_ISSUER_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::macOS signing secrets missing: ${missing[*]}. Channel builds must be signed — failing."
            exit 1
          fi
          # Import the Developer ID certificate into a temporary keychain.
          KEYCHAIN_PATH="$RUNNER_TEMP/spectrum-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          # Put the temp keychain first in the user search list + make it default so codesign finds the identity.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/[”"]//g')
          security default-keychain -s "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          # Write the App Store Connect API key + export the signing env for the build + cleanup steps.
          API_KEY_PATH="$RUNNER_TEMP/asc-api-key.p8"
          printf '%s' "$API_KEY_P8_BASE64" | base64 --decode > "$API_KEY_PATH"
          {
            echo "SPECTRUM_SIGNING_KEYCHAIN=$KEYCHAIN_PATH"
            echo "ELECTROBUN_DEVELOPER_ID=$SIGN_IDENTITY"
            echo "ELECTROBUN_APPLEAPIKEYPATH=$API_KEY_PATH"
            echo "ELECTROBUN_APPLEAPIKEY=$API_KEY_ID"
            echo "ELECTROBUN_APPLEAPIISSUER=$API_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Build desktop app (canary channel, for distribution + update artifacts)
        id: app
        if: matrix.app
        env:
          SPECTRUM_CANARY_BUILD: ${{ needs.version.outputs.canary-build }}
        # Hard gate: a canary build must ship a buildable channel bundle, same as
        # release.yml. Built on a clean checkout (the dev/smoke build runs LAST), so
        # build/ + artifacts/ here hold only the channel outputs the staging steps
        # publish. build:canary runs `electrobun build --env=canary` → artifacts
        # prefixed `canary-<os>-<arch>-…`. SPECTRUM_CANARY_BUILD (from the `version`
        # job) is baked into the bundle's version.json as `version-canary.N`.
        run: bun run --filter spectrum build:canary

      - name: Verify macOS signing + notarization (hard gate)
        if: matrix.app && runner.os == 'macOS' && steps.app.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          DMG=$(find apps/desktop/artifacts -maxdepth 2 -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::No .dmg in apps/desktop/artifacts/ — the channel build produced no macOS installer."
            ls -la apps/desktop/artifacts/ || true
            exit 1
          fi
          echo "Verifying installer: $DMG"

          # 1. The DMG carries a valid Developer ID signature (not adhoc/unsigned).
          codesign --verify --verbose=2 "$DMG"
          codesign -dvvv "$DMG" 2>&1 | tee /tmp/dmg-codesign.txt
          grep -q "Authority=Developer ID Application" /tmp/dmg-codesign.txt \
            || { echo "::error::DMG is not signed with a Developer ID Application identity."; exit 1; }

          # 2. The DMG has a stapled notarization ticket.
          xcrun stapler validate "$DMG"

          # 3. Mount the DMG and fully verify the inner .app.
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -mountpoint "$MNT" >/dev/null
          trap 'hdiutil detach "$MNT" >/dev/null 2>&1 || true' EXIT
          APP=$(find "$MNT" -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then echo "::error::No .app inside the DMG."; exit 1; fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvvv "$APP" 2>&1 | grep -q "Authority=Developer ID Application" \
            || { echo "::error::App inside the DMG is not Developer ID signed."; exit 1; }
          spctl -a -t exec -vvv "$APP" 2>&1 | tee /tmp/app-spctl.txt
          grep -q "source=Notarized Developer ID" /tmp/app-spctl.txt \
            || { echo "::error::Gatekeeper did not accept the app as Notarized Developer ID."; exit 1; }
          xcrun stapler validate "$APP"
          echo "✓ macOS installer is signed + notarized + stapled"

      - name: Stage installers (unix)
        if: matrix.archive == 'tar.gz' && matrix.app && steps.app.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage-desktop
          # OS installer replaces the old raw app bundle: macOS *.dmg, Linux *-Setup.tar.gz.
          shopt -s nullglob
          installers=(apps/desktop/artifacts/*.dmg apps/desktop/artifacts/*-Setup.tar.gz)
          if [ ${#installers[@]} -eq 0 ]; then
            echo "::error::No OS installer (*.dmg / *-Setup.tar.gz) in apps/desktop/artifacts/"
            ls -la apps/desktop/artifacts/ || true
            exit 1
          fi
          for f in "${installers[@]}"; do cp "$f" stage-desktop/; done

      - name: Stage installers (windows)
        if: matrix.archive == 'zip' && matrix.app && steps.app.outcome == 'success'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage-desktop | Out-Null
          # OS installer: Windows self-extracting installer, wrapped in a zip by Electrobun.
          $installers = Get-ChildItem "apps/desktop/artifacts" -Filter "*-Setup*.zip" -ErrorAction SilentlyContinue
          if (-not $installers) {
            Write-Error "No Windows installer (*-Setup*.zip) in apps/desktop/artifacts/"
            Get-ChildItem "apps/desktop/artifacts" -ErrorAction SilentlyContinue | Format-Table
            exit 1
          }
          foreach ($f in $installers) { Copy-Item $f.FullName "stage-desktop/" }

      - name: Stage update artifacts (auto-update feed → update-feed/)
        if: matrix.app && steps.app.outcome == 'success'
        shell: bash
        run: |
          mkdir -p update-feed
          # The in-app auto-updater reads these from the rolling `updates` tag, NOT the versioned
          # release page — so they go to a separate bucket and never clutter the release.
          find apps/desktop/artifacts -maxdepth 2 \
            \( -name '*-update.json' -o -name '*.patch' -o -name '*.tar.zst' \) \
            -exec cp {} update-feed/ \; || true

      - name: Build desktop app (dev bundle, for the verified-running smoke)
        id: smokebuild
        if: matrix.app
        # EPHEMERAL TEST FIXTURE ONLY: this dev bundle is built AFTER staging and
        # written to apps/desktop/build (never stage/), so it is never uploaded. It
        # exists solely to give the smoke a directly-runnable bundle.
        # best-effort (canary) until the verified-running smoke is green on every platform.
        continue-on-error: true
        shell: bash
        # The channel build above ships a self-extracting installer on Linux/Windows that
        # the loose-bundle smoke can't launch, so verify the app runs against a
        # directly-runnable dev bundle (same app code → faithful runtime gate). Remove the
        # channel bundle first so the smoke deterministically launches THIS dev bundle. The
        # channel bundle was only built (never executed), so this `rm` is safe on Windows —
        # unlike removing a bundle whose launcher the smoke just ran (a still-held lock →
        # "Device or resource busy"), which is why the dev build + smoke run LAST.
        run: |
          rm -rf apps/desktop/build
          bun run --filter spectrum build

      - name: Install Linux GUI runtime deps (xvfb + webkit2gtk + appindicator)
        if: matrix.app && runner.os == 'Linux'
        # Electrobun's libNativeWrapper.so dlopens the GTK/WebKit + app-indicator stack at startup
        # even with bundleCEF, so those runtime libs must be present or the app crashes
        # (ERR_DLOPEN_FAILED) before the proxy binds. xvfb provides the virtual display the GUI
        # smoke needs. The trailing `ldd` surfaces any still-unresolved wrapper deps up front so a
        # missing lib shows here instead of as an opaque smoke failure.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libwebkit2gtk-4.1-0 \
            libgtk-3-0 \
            libayatana-appindicator3-1 \
            librsvg2-2 \
            libnotify4
          LIB=$(find apps/desktop/build -name libNativeWrapper.so | head -1)
          if [ -n "$LIB" ]; then
            echo "== ldd $LIB =="
            ldd "$LIB" | (grep 'not found' && echo '::warning::libNativeWrapper.so has unresolved deps (above)' || echo 'all wrapper deps resolved')
          fi

      - name: Verified-running smoke (Linux)
        if: matrix.app && runner.os == 'Linux' && steps.smokebuild.outcome == 'success'
        run: xvfb-run -a bun run --filter spectrum smoke

      - name: Verified-running smoke (macOS/Windows)
        if: matrix.app && runner.os != 'Linux' && steps.smokebuild.outcome == 'success'
        run: bun run --filter spectrum smoke

      - name: Guard — buckets hold exactly the expected artifacts
        if: matrix.app
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          # The auto-update feed must exist (proves the channel build emitted update metadata).
          updates=(update-feed/*-update.json)
          if [ ${#updates[@]} -eq 0 ]; then
            echo "::error::No *-update.json in update-feed/ — the channel build emitted no update metadata."
            ls -la update-feed/ stage-desktop/ || true
            exit 1
          fi
          # The release page must hold ONLY the installer(s) — no feed leakage, no dev bundles,
          # no CLI archive (CLI artifacts are uploaded by build-cli, not here).
          for f in stage-desktop/*; do
            case "$(basename "$f")" in
              *.dmg|*-Setup.tar.gz|*-Setup*.zip) ;;
              *) echo "::error::Unexpected artifact staged for the release page: $f"; exit 1 ;;
            esac
          done
          echo "stage-desktop/ (release-page assets):"; ls -1 stage-desktop/
          echo "update-feed/:"; ls -1 update-feed/

      - name: Upload release-page assets
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: stage-desktop/*
          if-no-files-found: error

      - name: Upload auto-update feed
        if: matrix.app && steps.app.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: update-feed-${{ matrix.asset }}
          path: update-feed/*
          if-no-files-found: error

      - name: Clean up signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          [ -n "${SPECTRUM_SIGNING_KEYCHAIN:-}" ] && security delete-keychain "$SPECTRUM_SIGNING_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/asc-api-key.p8" || true

  release:
    name: Publish Canary Release
    needs: [build-cli, build-desktop, version]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Report canary version
        run: |
          echo "Publishing canary tag: ${{ needs.version.outputs.canary-tag }}"
      - name: Download CLI artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: '*-cli'
          merge-multiple: true
      - name: Download release-page assets (desktop installers)
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: spectrum-*
          merge-multiple: true
      - name: Download auto-update feed
        uses: actions/download-artifact@v8
        with:
          path: update-feed
          pattern: update-feed-*
          merge-multiple: true
      - name: Checksums (release-page assets only)
        run: cd release-assets && sha256sum * > checksums-sha256.txt
      - name: Create canary release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          START_TAG: ${{ needs.version.outputs.start-tag }}
        run: |
          # Keep the existing context line as a preamble; --generate-notes appends the
          # changelog (PR titles + contributors) from START_TAG to the release commit.
          NOTES_START=()
          if [ -n "${START_TAG}" ]; then
            NOTES_START=(--notes-start-tag "${START_TAG}")
          fi
          gh release create ${{ needs.version.outputs.canary-tag }} \
            --title "${{ needs.version.outputs.canary-tag }}" \
            --notes "Automated canary build from \`main\` (${{ github.sha }}). Unstable pre-release." \
            --generate-notes "${NOTES_START[@]}" \
            --prerelease --target ${{ github.sha }} \
            release-assets/*

      - name: Publish update artifacts to rolling tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ensure the rolling release exists, then clobber its update assets so the
          # baked baseUrl (.../releases/download/updates/) always serves the newest.
          # Canary artifacts are prefixed `canary-…` and coexist with stable on the
          # same rolling release because the channel is baked into the filename.
          gh release view updates >/dev/null 2>&1 || \
            gh release create updates \
              --title "Auto-update channel feed" \
              --notes "Rolling update metadata + patches. Managed by CI." \
              --prerelease
          shopt -s nullglob
          UPDATE_ASSETS=(update-feed/*-update.json update-feed/*.patch update-feed/*.tar.zst)
          if [ ${#UPDATE_ASSETS[@]} -gt 0 ]; then
            gh release upload updates "${UPDATE_ASSETS[@]}" --clobber
          fi